name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: No private data in the tree
        run: node scripts/check-public-safe.mjs

      - name: Manifests agree with the skills on disk
        run: node scripts/validate-manifests.mjs
